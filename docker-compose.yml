services:
  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    ports:
      - "${AYMANE_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      target: backend
    environment:
      AYMANE_API_HOST: 0.0.0.0
      AYMANE_API_PORT: 8787
      AYMANE_DB_PATH: server/data/aymane.sqlite
      AYMANE_IP_HASH_SECRET: ${AYMANE_IP_HASH_SECRET:?Set AYMANE_IP_HASH_SECRET}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    volumes:
      - aymane-data:/app/server/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

volumes:
  aymane-data:
