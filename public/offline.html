<!doctype html>
<html lang="fr-SN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17324d" />
    <title>AYMANE - Connexion indisponible</title>
    <style>
      :root {
        color: #17324d;
        background: #f7fafc;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #d8e2ea;
        border-radius: 20px;
        background: #ffffff;
        padding: 24px;
        box-shadow: 0 18px 48px rgba(23, 50, 77, 0.08);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.05;
      }

      p {
        margin: 12px 0 0;
        color: #5d6e7e;
        font-size: 15px;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 22px;
        border-radius: 999px;
        background: #17324d;
        color: #ffffff;
        padding: 0 18px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connexion instable.</h1>
      <p>AYMANE garde les pages déjà ouvertes disponibles. Pour envoyer une demande, un paiement ou une urgence, reconnectez-vous au réseau.</p>
      <a href="/">Revenir à l'accueil</a>
    </main>
  </body>
</html>
